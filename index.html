<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enigma</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1><abbr title="Enigma, spelled as it sounds">Ɛnɪɡmə</abbr></h1>

    <div class="controls">
      <select id="presets" aria-label="Preset texts">
        <option value="" selected>Presets…</option>
      </select>
      <details class="options">
        <summary>Options</summary>
        <div class="panel">
          <label class="panel-row">
            <span>Dialect</span>
            <select id="voice"></select>
          </label>
          <label class="panel-row">
            <span>Font</span>
            <select id="font">
              <option value="Gentium" selected>Gentium</option>
              <option value="Gentium Book">Gentium Book</option>
              <option value="Charis">Charis</option>
              <option value="Doulos SIL">Doulos SIL</option>
              <option value="Andika">Andika</option>
              <option value="system-ui">System</option>
            </select>
          </label>

          <label class="panel-row">
            <span>Stress</span>
            <select id="stress">
              <option value="accents" selected>Accents á à</option>
              <option value="highlight">Highlighted</option>
              <option value="marks">Marks ˈa ˌa</option>
              <option value="none">None</option>
            </select>
          </label>
          <label class="panel-row">
            <span>Vowel length</span>
            <select id="length">
              <option value="double" selected>Doubling aa</option>
              <option value="standard">Colon aː</option>
              <option value="dot">Raised dot a·</option>
              <option value="macron">Macron ā</option>
            </select>
          </label>

          <label class="check">
            <input type="checkbox" id="punctuation" checked> Include punctuation
          </label>
          <label class="check subsequent">
            <input type="checkbox" id="capitals" checked> Preserve capitalization
          </label>
        </div>
      </details>
    </div>

    <textarea id="input" placeholder="Type or paste text…" autofocus
      spellcheck="false"></textarea>

    <output id="output" for="input" aria-live="polite">
      <span class="status">Loading espeak-ng…</span>
    </output>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

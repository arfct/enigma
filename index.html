<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonography</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Phonography</h1>

    <div class="controls">
      <select id="presets" aria-label="Preset texts">
        <option value="" selected>Presets…</option>
      </select>
      <select id="voice" aria-label="Dialect"></select>
      <select id="font" aria-label="Output font">
        <option value="Gentium" selected>Gentium</option>
        <option value="Gentium Book">Gentium Book</option>
        <option value="Charis">Charis</option>
        <option value="Doulos SIL">Doulos SIL</option>
        <option value="Andika">Andika</option>
        <option value="system-ui">System</option>
      </select>
      <details class="options">
        <summary>Options</summary>
        <div class="panel">
          <p class="panel-label">Stress</p>
          <div class="mode-list">
            <label>
              <input type="radio" name="stress" value="accents" checked>
              <span class="sample">á à</span><span class="name">Accent marks</span>
            </label>
            <label>
              <input type="radio" name="stress" value="highlight">
              <span class="sample"><b class="primary">a</b> <b class="secondary">a</b></span><span class="name">Highlighted</span>
            </label>
            <label>
              <input type="radio" name="stress" value="marks">
              <span class="sample">ˈa ˌa</span><span class="name">Stress marks</span>
            </label>
            <label>
              <input type="radio" name="stress" value="none">
              <span class="sample">a a</span><span class="name">None</span>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" id="punctuation" checked> Include punctuation
          </label>
        </div>
      </details>
    </div>

    <textarea id="input" placeholder="Type or paste text…" autofocus
      spellcheck="false">We hold these truths to be self-evident</textarea>

    <output id="output" for="input" aria-live="polite">
      <span class="status">Loading espeak-ng…</span>
    </output>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
